# XcodeGen spec for ScamAware-iOS.
#
# The .xcodeproj is NOT checked in: it is generated from this file on the
# Codemagic macOS machine (`xcodegen generate`), so the project can be edited
# and reviewed on Windows as plain text. See docs/CODEMAGIC_SETUP.md.
#
# Versions and the bundle ID come from ios/Config/Version.xcconfig, which
# scripts/set-version.sh writes from version.json - never hard-code them here.
name: ScamAwareIOS
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant
configFiles:
  Debug: ios/Config/Version.xcconfig
  Release: ios/Config/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: ios/ScamAwareIOS/Info.plist
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  ScamAwareIOS:
    type: application
    platform: iOS
    sources:
      - path: ios/ScamAwareIOS
        excludes:
          - "Info.plist"
      # The built web app (web/dist), copied in by scripts/build-web.sh.
      # A folder reference, so the directory tree is kept as-is inside the .app
      # and BundleSchemeHandler can serve it at app://localhost/.
      - path: ios/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ScamAwareIOS
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    scheme:
      configVariants: [Debug, Release]
